name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project with environment variables
        env:
          # Reads from GitHub Repo Variables / Secrets with intelligent fallbacks
          VITE_ADSENSE_CLIENT_ID: ${{ vars.VITE_ADSENSE_CLIENT_ID || secrets.VITE_ADSENSE_CLIENT_ID || 'ca-pub-6816887029574421' }}
          VITE_ADSENSE_SLOT_ID: ${{ vars.VITE_ADSENSE_SLOT_ID || secrets.VITE_ADSENSE_SLOT_ID }}
          VITE_ADSENSE_HORIZONTAL_SLOT_ID: ${{ vars.VITE_ADSENSE_HORIZONTAL_SLOT_ID || secrets.VITE_ADSENSE_HORIZONTAL_SLOT_ID }}
          VITE_ADSENSE_INFEED_SLOT_ID: ${{ vars.VITE_ADSENSE_INFEED_SLOT_ID || secrets.VITE_ADSENSE_INFEED_SLOT_ID }}
          VITE_ADSENSE_RECTANGLE_SLOT_ID: ${{ vars.VITE_ADSENSE_RECTANGLE_SLOT_ID || secrets.VITE_ADSENSE_RECTANGLE_SLOT_ID }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
