<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Elegant smooth gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <!-- Amber accent gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Container Rounded Badge -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#27272A" stroke-width="1.5" />

  <!-- Code bracket accent (top left & bottom right subtle decorative marks) -->
  <path d="M12 24 L8 28 L8 36 L12 40" fill="none" stroke="#52525B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M52 24 L56 28 L56 36 L52 40" fill="none" stroke="#52525B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Monogram "JS" in bold typographic golden amber styling -->
  <!-- J letter -->
  <path d="M22 23 L28 23 L28 37 C28 40.5 25.5 43 21 43 C17.5 43 15.5 41 15 39" 
        fill="none" 
        stroke="url(#amberGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- S letter -->
  <path d="M46 25.5 C44.5 23.5 41.5 22.5 38.5 23 C35.5 23.5 34 25.5 34 28 C34 32.5 47 31.5 47 37.5 C47 41 44 43 38.5 43 C34 43 32 40.5 31.5 38.5" 
        fill="none" 
        stroke="url(#amberGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Core Engine Sparkle / Node Dot -->
  <circle cx="48" cy="16" r="2.5" fill="#F59E0B" />
</svg>
